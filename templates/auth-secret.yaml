{{- /*
Secret chứa credential của RabbitMQ, chart bitnami/rabbitmq đọc qua
rabbitmq.auth.existingPasswordSecret / existingErlangSecret.
Giá trị sinh ngẫu nhiên một lần rồi giữ nguyên khi upgrade (lookup Secret đang có,
hoặc Secret cũ <release>-rabbitmq do chart bitnami tạo trước đây).
Tắt authSecret.create nếu Secret được quản lý bên ngoài (kubectl, Sealed Secrets, External Secrets...).
*/ -}}
{{- if .Values.authSecret.create }}
{{- $name := tpl .Values.rabbitmq.auth.existingPasswordSecret . }}
{{- $legacy := printf "%s-rabbitmq" .Release.Name }}
{{- $password := include "homelab.rabbitmq.storedCredential" (dict "secret" $name "legacySecret" $legacy "key" "rabbitmq-password" "context" $) | default (randAlphaNum 24) }}
{{- $erlangCookie := include "homelab.rabbitmq.storedCredential" (dict "secret" $name "legacySecret" $legacy "key" "rabbitmq-erlang-cookie" "context" $) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Giữ Secret khi gỡ release để cài lại vẫn dùng đúng credential với dữ liệu trên PVC.
    helm.sh/resource-policy: keep
type: Opaque
data:
  rabbitmq-password: {{ $password | b64enc | quote }}
  rabbitmq-erlang-cookie: {{ $erlangCookie | b64enc | quote }}
{{- end }}
