# Giá trị truyền xuống chart bitnami/rabbitmq.
# Xem đầy đủ: https://artifacthub.io/packages/helm/bitnami/rabbitmq?modal=values
rabbitmq:
  # docker.io/bitnami/rabbitmq không còn tag nào; image cũ được giữ ở bitnamilegacy
  # (không còn nhận bản vá bảo mật).
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  global:
    security:
      # Chart Bitnami chặn image ngoài repo bitnami/* nếu không bật cờ này.
      allowInsecureImages: true

  # HA: 3 node gom cluster qua rabbitmq_peer_discovery_k8s. Quorum queue cần đa số node
  # (2/3) còn sống, nên 3 là số node tối thiểu chịu được mất 1 node. Đặt 1 để chạy single node.
  replicaCount: 3

  # Parallel: các pod khởi động cùng lúc. Với OrderedReady, nếu node tắt sau cùng không phải
  # pod-0 thì pod-0 chờ peer mãi, pod-1/2 không được tạo -> cluster kẹt khi restart.
  # Trường này immutable trên StatefulSet: đổi trên release đang chạy phải xoá StatefulSet
  # trước (xem README, mục HA).
  podManagementPolicy: Parallel

  clustering:
    enabled: true
    # pause_minority: bên thiểu số tự dừng khi mạng bị chia, tránh 2 bên cùng nhận ghi.
    # Hợp với cluster số node lẻ; quorum queue tự xử lý partition theo Raft.
    partitionHandling: pause_minority
    forceBoot: false

  # Rải pod ra các node Kubernetes khác nhau. soft = vẫn schedule được khi cluster ít node hơn
  # replicaCount (khi đó mất 1 node k8s có thể mất đa số RabbitMQ). hard nếu có >= 3 node.
  podAntiAffinityPreset: soft

  # Drain/upgrade node chỉ được làm mất 1 pod RabbitMQ mỗi lần, giữ đa số cho quorum queue.
  pdb:
    create: true
    maxUnavailable: 1

  # Queue khai báo không có x-queue-type sẽ là quorum queue (replicate qua các node).
  # Classic queue không replicate (mirroring đã bị bỏ từ RabbitMQ 4.0).
  # Chỉ áp dụng cho vhost tạo mới; vhost "/" đã có từ trước phải chỉnh tay (xem README, mục HA).
  extraConfiguration: |-
    default_queue_type = quorum
    cluster_formation.target_cluster_size_hint = {{ .Values.replicaCount }}

  auth:
    username: app
    # Mật khẩu và Erlang cookie nằm trong Secret <release>-rabbitmq-auth (xem authSecret ở cuối file).
    existingPasswordSecret: '{{ .Release.Name }}-rabbitmq-auth'
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: '{{ .Release.Name }}-rabbitmq-auth'
    existingSecretErlangKey: rabbitmq-erlang-cookie
    # Không ghi mật khẩu vào đây: giá trị được đọc từ Secret đang có trong cluster lúc deploy.
    # Chart bitnami bắt buộc biết mật khẩu hiện tại khi upgrade (PASSWORDS ERROR) nếu Secret
    # existingPasswordSecret chưa tồn tại.
    password: '{{ include "homelab.rabbitmq.storedCredential" (dict "secret" (tpl .Values.auth.existingPasswordSecret .) "legacySecret" (printf "%s-rabbitmq" .Release.Name) "key" "rabbitmq-password" "context" .) }}'

  persistence:
    enabled: true
    size: 2Gi
    # Để trống = dùng StorageClass mặc định của cluster.
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Management UI + HTTP API (port 15672). rabbitmq_peer_discovery_k8s cần cho clustering.
  plugins: "rabbitmq_management rabbitmq_peer_discovery_k8s"

  service:
    type: ClusterIP
    managerPortEnabled: true

  # Mở management UI ra ngoài cluster qua Ingress (trỏ tới port 15672).
  # Host = <subdomain>.<global.baseDomain>, ví dụ rabbitmq-mgm.vodka.bid.
  # global.baseDomain do umbrella chart scs đặt (không khai báo ở đây để khỏi đè giá trị của scs).
  ingress:
    enabled: false
    subdomain: rabbitmq-mgm
    hostname: '{{ .Values.ingress.subdomain }}.{{ required "global.baseDomain is required when ingress is enabled" .Values.global.baseDomain }}'
    path: /
    pathType: ImplementationSpecific
    # Để trống = dùng IngressClass mặc định của cluster (k3s: traefik).
    ingressClassName: ""
    tls: false

  metrics:
    enabled: false

# Secret credential do chart này tạo (templates/auth-secret.yaml), tên lấy từ
# rabbitmq.auth.existingPasswordSecret. Key: rabbitmq-password, rabbitmq-erlang-cookie.
# create: false nếu tự quản lý Secret đó (tạo bằng kubectl, Sealed Secrets, External Secrets...).
authSecret:
  create: true
