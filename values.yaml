# Giá trị truyền xuống chart bitnami/rabbitmq.
# Xem đầy đủ: https://artifacthub.io/packages/helm/bitnami/rabbitmq?modal=values
rabbitmq:
  # docker.io/bitnami/rabbitmq không còn tag nào; image cũ được giữ ở bitnamilegacy
  # (không còn nhận bản vá bảo mật).
  image:
    repository: bitnamilegacy/rabbitmq
    tag: 4.1.3-debian-12-r1
  global:
    security:
      # Chart Bitnami chặn image ngoài repo bitnami/* nếu không bật cờ này.
      allowInsecureImages: true

  replicaCount: 1

  auth:
    username: app
    # Mật khẩu và Erlang cookie nằm trong Secret <release>-rabbitmq-auth (xem authSecret ở cuối file).
    existingPasswordSecret: '{{ .Release.Name }}-rabbitmq-auth'
    existingSecretPasswordKey: rabbitmq-password
    existingErlangSecret: '{{ .Release.Name }}-rabbitmq-auth'
    existingSecretErlangKey: rabbitmq-erlang-cookie

  persistence:
    enabled: true
    size: 2Gi
    # Để trống = dùng StorageClass mặc định của cluster.
    storageClass: ""

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  # Management UI + HTTP API (port 15672). rabbitmq_peer_discovery_k8s cần cho clustering.
  plugins: "rabbitmq_management rabbitmq_peer_discovery_k8s"

  service:
    type: ClusterIP
    managerPortEnabled: true

  # Mở management UI ra ngoài cluster qua Ingress (trỏ tới port 15672).
  # Host = <subdomain>.<global.baseDomain>, ví dụ rabbitmq-mgm.vodka.bid.
  # global.baseDomain do umbrella chart scs đặt (không khai báo ở đây để khỏi đè giá trị của scs).
  ingress:
    enabled: false
    subdomain: rabbitmq-mgm
    hostname: '{{ .Values.ingress.subdomain }}.{{ required "global.baseDomain is required when ingress is enabled" .Values.global.baseDomain }}'
    path: /
    pathType: ImplementationSpecific
    # Để trống = dùng IngressClass mặc định của cluster (k3s: traefik).
    ingressClassName: ""
    tls: false

  metrics:
    enabled: false

# Secret credential do chart này tạo (templates/auth-secret.yaml), tên lấy từ
# rabbitmq.auth.existingPasswordSecret. Key: rabbitmq-password, rabbitmq-erlang-cookie.
# create: false nếu tự quản lý Secret đó (tạo bằng kubectl, Sealed Secrets, External Secrets...).
authSecret:
  create: true
